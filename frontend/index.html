<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS Links -->
  <link rel="stylesheet" href="/Bunny-and-Bloom-/frontend/assets/css/spapp.css">
  <link rel="stylesheet" href="/Bunny-and-Bloom-/frontend/assets/css/mainsty.css">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://kit.fontawesome.com/2fbc0a7645.js" crossorigin="anonymous"></script>

  <!-- jQuery + SPA -->
  <script src="/Bunny-and-Bloom-/frontend/assets/js/jquery.min.js"></script>
  <script src="/Bunny-and-Bloom-/frontend/assets/js/jquery.spapp.min.js"></script>
  <script src="/Bunny-and-Bloom-/frontend/assets/js/mainjs.js"></script>

 
</head>

<body>
  <!-- 🌸 Navbar -->
  <nav class="navbar navbar-expand-lg fixed-top py-3 shadow-sm" id="mainNav">
    <div class="container px-4 px-lg-5">
      <a class="navbar-brand fw-bold text-light" href="#Home">☕ Bunny & Bloom</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
        aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
        <i class="fas fa-bars"></i>
      </button>

      <div class="collapse navbar-collapse" id="navbarResponsive">
        <ul class="navbar-nav ms-auto my-2 my-lg-0 text-center text-lg-start">
          <li class="nav-item mx-2"><a class="nav-link" href="#Home">Home</a></li>
          <li class="nav-item mx-2"><a class="nav-link" href="#blog">Blog</a></li>
          <li class="nav-item mx-2"><a class="nav-link" href="#About">About</a></li>
          <li class="nav-item mx-2"><a class="nav-link" href="#menu">Menu</a></li>
          <li class="nav-item mx-2"><a class="nav-link" href="#admin">Admin</a></li>
          <li class="nav-item mx-2"><a class="nav-link" href="#Profile">Profile</a></li>
          <li class="nav-item mx-2"><a class="nav-link btn btn-outline-light px-3 py-1 rounded-pill" href="#registration">registration</a></li>
          <li class="nav-item mx-2"><a class="nav-link btn btn-outline-light px-3 py-1 rounded-pill" href="#signin">Register</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 🧋 SPA Sections -->
  <main id="spapp" role="main">
    <section id="Home" data-load="Home.html"></section>
    <section id="blog" data-load="blog.html"></section>
    <section id="About" data-load="about.html"></section>
    <section id="menu" data-load="menu.html"></section>
    <section id="registration" data-load="regest.html"></section>
    <section id="signin" data-load="signin.html"></section>
    <section id="admin" data-load="admin.html"></section>
    <section id="Profile" data-load="Profile.html"></section>
  </main>

  <!-- 🌿 Footer -->
  <footer>
    <div class="container">
      <p class="mb-1">&copy; 2025 Bunny & Bloom Coffee House</p>
      <p class="small mb-0">
        <a href="#About">About</a> | 
        <a href="#menu">Menu</a> | 
        <a href="#blog">Blog</a> | 
        <a href="#Profile">Profile</a>
      </p>
    </div>
  </footer>

  <!-- 📜 SPA Script -->
  <script>
    var app = $.spapp({
      defaultView: "#Home",
      templateDir: "./pages/"
    });
    app.run();
  </script>

</body>
</html>
