<div class="container position-relative mt-5" style="overflow: hidden; padding: 5%; background: #fdf6f0; min-height: 90vh;">

  <!-- Floating circles -->
  <div class="circle circle1"></div>
  <div class="circle circle2"></div>
  <div class="circle circle3"></div>
  <div class="circle circle4"></div>

  <!-- Emoji specials -->
  <div class="special-decor decor1">☕</div>
  <div class="special-decor decor2">🍰</div>
  <div class="special-decor decor3">🌿</div>

  <!-- Profile Card -->
  <h1 class="h1heh text-center mb-5">My Profile</h1>
  <div class="card mx-auto" style="max-width: 500px; text-align: center;">
    
    <!-- Image / Avatar Area -->
    <div class="mb-4">
      <img src="/Bunny-and-Bloom-/frontend/assets/img/images/0d00faf7e0a04fe724ecd886df774e4c.jpg" alt="Profile Image" class="rounded-circle img-fluid" style="width: 150px; height: 150px; object-fit: cover; box-shadow: 0 5px 20px rgba(0,0,0,0.15);">
    </div>

    <!-- Profile Info -->
    <div class="mb-3 text-start">
      <label for="name" class="form-label">Name</label>
      <input type="text" class="form-control" id="name" placeholder="John Doe" readonly>
    </div>
    <div class="mb-3 text-start">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" placeholder="johndoe@example.com" readonly>
    </div>
    <div class="mb-3 text-start">
      <label for="role" class="form-label">Role</label>
      <input type="text" class="form-control" id="role" value="User" readonly>
    </div>

    <!-- Edit Button -->
    <button class="btn btn-coffee mt-3">Edit Profile</button>
  </div>

</div>
